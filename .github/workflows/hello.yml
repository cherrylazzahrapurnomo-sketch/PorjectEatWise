
name: EatWise CI/CD Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eatwise-deployment
  cancel-in-progress: false

jobs:
  greeting-keiii:
    name: Test Runner 1
    runs-on: [self-hosted, runner-1]

    steps:
      - name: Say Hello
        run: echo "Hello from Runner 1!"

      - name: Show Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Current time: $(date)"

  greeting-keiii-2:
    name: Test Runner 2
    runs-on: [self-hosted, runner-2]

    steps:
      - name: Say Hello
        run: echo "Hello from Runner 2!"

      - name: Show Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Current time: $(date)"

  docker-check:
    name: Test Docker Access
    runs-on: [self-hosted, runner-1]
    needs: [greeting-keiii, greeting-keiii-2]

    steps:
      - name: Check Docker Version
        run: docker --version

      - name: Check Docker Engine
        run: |
          docker info --format 'Docker Engine: {{.ServerVersion}}'

      - name: Check Docker Compose
        run: docker compose version

  deploy:
    name: Deploy EatWise
    runs-on: [self-hosted, runner-1]
    needs: [docker-check]

    steps:
      - name: Check Deployment Directory
        run: |
          test -d /mnt/d/vscode/PorjectEatWise
          test -f /mnt/d/vscode/PorjectEatWise/.env
          test -f /mnt/d/vscode/PorjectEatWise/docker-compose.yml
          echo "Deployment directory is ready."

      - name: Check Existing Database
        run: |
          DB_STATUS=$(docker inspect -f '{{.State.Health.Status}}' eatwise_db)
          echo "Database status: $DB_STATUS"

          if [ "$DB_STATUS" != "healthy" ]; then
            echo "Database is not healthy. Deployment stopped."
            exit 1
          fi

      - name: Update Project from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_DIR="/mnt/d/vscode/PorjectEatWise"

          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)

          git -C "$DEPLOY_DIR" \
            -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            pull --ff-only origin main

      - name: Build and Deploy Web Container
        run: |
          cd /mnt/d/vscode/PorjectEatWise

          docker compose up -d --build --no-deps web

      - name: Verify EatWise Deployment
        run: |
          docker ps --filter name=eatwise_web

          curl -fsS http://localhost:8080/ > /dev/null

          echo "EatWise deployment successful!"
