
name: Hello World Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  greeting-keiii:
    name: Test Runner 1
    runs-on: [self-hosted, runner-1]

    steps:
      - name: Say Hello
        run: echo "Hello from Runner 1!"

      - name: Show Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Current time: $(date)"

  greeting-keiii-2:
    name: Test Runner 2
    runs-on: [self-hosted, runner-2]

    steps:
      - name: Say Hello
        run: echo "Hello from Runner 2!"

      - name: Show Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Current time: $(date)"

  docker-check:
    name: Test Docker Access
    runs-on: [self-hosted, runner-1]
    needs: [greeting-keiii, greeting-keiii-2]

    steps:
      - name: Check Docker Version
        run: docker --version

      - name: Check Docker Engine
        run: docker info --format 'Docker Engine: {{.ServerVersion}}'

      - name: Check Docker Compose
        run: docker compose version
